name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  cli-and-core:
    name: CLI and Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rumux-core -p rumux-cli

  desktop-app:
    name: Desktop Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo bash scripts/install-linux-deps.sh
      - run: cargo test --workspace --locked
      - run: cargo build -p rumux-app -p rumux-cli --locked
      - name: Desktop PTY smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- xvfb-run -a python3 scripts/smoke-desktop.py --browser --ssh
          dbus-run-session -- xvfb-run -a python3 scripts/smoke-desktop.py --browser --ssh --tcp
      - name: Desktop PTY smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 scripts/smoke-desktop.py --browser --ssh
          python3 scripts/smoke-desktop.py --browser --ssh --tcp
      - name: Desktop PTY smoke test (Windows)
        if: runner.os == 'Windows'
        env:
          RUMUX_TRACE_WINDOWS_CLOSE: '1'
        run: python scripts/smoke-desktop.py --app target/debug/rumux-app.exe --cli target/debug/rumux.exe --browser

  desktop-package:
    name: Installed Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: installed-desktop
          cache-on-failure: true
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo bash scripts/install-linux-deps.sh
      - name: Package desktop and CLI
        shell: bash
        run: bash scripts/package-desktop.sh
      - name: Install and exercise package (Linux)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python3 scripts/smoke-package.py --archive dist/desktop/artifacts/rumux-desktop-x86_64-unknown-linux-gnu.tar.gz --ssh
      - name: Install and exercise package (macOS)
        if: runner.os == 'macOS'
        run: python3 scripts/smoke-package.py --archive dist/desktop/artifacts/rumux-desktop-aarch64-apple-darwin.zip --ssh
      - name: Install and exercise package (Windows)
        if: runner.os == 'Windows'
        run: python scripts/smoke-package.py --archive dist/desktop/artifacts/rumux-desktop-x86_64-pc-windows-msvc.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: dist/desktop/artifacts/*
          if-no-files-found: error
