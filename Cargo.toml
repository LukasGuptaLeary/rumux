[workspace]
members = [
    "crates/rumux-core",
    "crates/rumux-cli",
    "crates/gpui-terminal",
    "app",
]
default-members = [
    "crates/rumux-core",
    "crates/rumux-cli",
    "app",
]
exclude = [
    "crates/gpui-component",
    "crates/gpui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/LukasGuptaLeary/rumux"
homepage = "https://github.com/LukasGuptaLeary/rumux"

[patch.crates-io]
# GPUI 0.2.2 X11 raw-window/display handles panic; the local patch implements
# those handles for native browser child views without changing the renderer.
gpui = { path = "crates/gpui" }
